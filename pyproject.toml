[project]
name = "rivet"
version = "0.1.0"
description = "Evidence-first equipment quoting workspace"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "python-multipart>=0.0.20",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "httpx>=0.28",
    "PyJWT[crypto]>=2.10,<3",
    "python-dotenv>=1.0",
    "playwright>=1.50",
    "clerk-backend-api>=6.0,<7",
    "svix>=1.60,<2",
    "ezdxf>=1.4,<2",
    "reportlab>=4.4,<5",
    "tiktoken>=0.12,<1",
    "pymupdf>=1.26,<2",
    "pypdf>=6,<7",
    "pillow>=12.3,<13",
    "numpy>=2,<3",
]
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.9",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
