[project]
name = "rivet"
version = "0.1.0"
description = "Evidence-first equipment quoting workspace"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.14", "pydantic>=2.10", "python-multipart>=0.0.20", "pdfplumber>=0.11", "openpyxl>=3.1", "httpx>=0.28", "python-dotenv>=1.0", "playwright>=1.50"]
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.9",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
