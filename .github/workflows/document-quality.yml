name: Public document quality
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  workflow-regressions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rivet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RIVET_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rivet_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
  public-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: .data/real-document-corpus
          key: public-documents-${{ hashFiles('benchmarks/documents/sources.json') }}
      - run: uv run python -m scripts.benchmark_public_documents --fetch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-quality-report
          path: benchmarks/documents/latest-report.json
